map $uri $cache_control {
  default                "public, max-age=86400";
  ~^/assets/             "public, max-age=31536000, immutable";
  ~^/workbox-[^/]+\.js$  "public, max-age=31536000, immutable";
  /index.html            "no-cache";
  /sw.js                 "no-cache";
  /registerSW.js         "no-cache";
}

server {
  listen       8080;
  listen  [::]:8080;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;
  absolute_redirect off;

  resolver 127.0.0.11 ipv6=off valid=10s;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/plain text/xml application/javascript application/json
             application/manifest+json image/svg+xml;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /site.webmanifest {
    types { }
    default_type application/manifest+json;
  }

  location ^~ /assets/ {
    try_files $uri =404;
  }

  location /auth/ {
    set $up_kratos http://kratos:4433;
    rewrite ^/auth/(.*)$ /$1 break;
    proxy_pass $up_kratos;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $upstream_http_cache_control always;
  }

  location /api/ {
    set $up_kanae http://kanae:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $up_kanae;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $upstream_http_cache_control always;
  }

  location ~ ^/(kanae-media|kanae-public)/ {
    set $up_garage http://garage:3900;
    proxy_pass $up_garage;
    proxy_set_header Host $http_host;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $upstream_http_cache_control always;
  }

  location /public/ {
    set $up_garage_web http://garage:3902;
    rewrite ^/public/(.*)$ /$1 break;
    proxy_pass $up_garage_web;
    proxy_set_header Host kanae-public.web.garage.localhost;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $upstream_http_cache_control always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
