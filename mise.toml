[tools]
node = "24.14.1"
pnpm = "10.33.0"


[settings]
experimental = true
pin = true



[tasks."web:dev"]
alias = ["web:up"]
description = "Start frontend development server. Save file(s) to see changes"
env._.path = "./react/node_modules/.bin"
dir = "{{ config_root }}/react"
run = "vite"

[tasks."web:build"]
description = "Builds the frontend for distribution/preview"
env._.path = "./react/node_modules/.bin"
dir = "{{ config_root }}/react"
run = "tsc && vite build"

[tasks."web:preview"]
description = "Previews frontend"
env._.path = "./react/node_modules/.bin"
dir = "{{ config_root }}/react"
run = "vite preview"

[tasks."web:check"]
description = "Lints and formats the react codebase "
env._.path = "./react/node_modules/.bin"
dir = "{{ config_root }}/react"
run = "biome check --error-on-warnings --write ."
