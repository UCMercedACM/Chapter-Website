pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx --bun biome check --write --error-on-warnings --colors=off {staged_files}
      stage_fixed: true
    rustywind:
      glob: "*.{js,ts,jsx,tsx}"
      run: bunx rustywind {staged_files} --write
      stage_fixed: true
