version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/react/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[npm]"
      include: "scope"
    target-branch: "react-rewrite"
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@biomejs/*"
